services:
  # ── Redis (cache / sockets adapter) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: laplume-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - laplume-net

  # ── Backend API (Node/Express + Socket.IO) ───────────────────────────
  # DB is external (OVH CloudDB) — no local postgres service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laplume-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Database (OVH CloudDB)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-true}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      SESSION_SECRET: ${SESSION_SECRET}
      # CORS & URLs
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # WhatsApp
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      # AI
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY}
      # Push notifications
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      # Google Drive (optional)
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/dashboard/kpis"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    expose:
      - "5000"
    networks:
      - laplume-net

  # ── Frontend (React build served by internal nginx) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laplume-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    expose:
      - "80"
    networks:
      - laplume-net

  # ── Nginx reverse proxy (TLS termination + routing) ──────────────────
  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: laplume-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/nginx/certbot-webroot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - laplume-net

volumes:
  redis_data:

networks:
  laplume-net:
    driver: bridge
